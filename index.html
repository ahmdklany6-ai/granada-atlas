  <nav class="tb" id="tb-nav">
    <button class="tb-btn" data-drawer="areas" data-i18n="nav.areas">المناطق المحفوظة</button>
    <button class="tb-btn" id="tb-compare" data-i18n="nav.compare">مقارنة وتمرين 1.2</button>
    <button class="tb-btn" data-page="library" data-i18n="nav.library">معلومات عامة</button>
    <button class="tb-btn" data-page="history" data-i18n="nav.history">الخرائط التاريخية</button>
    <button class="tb-btn" data-page="studio" data-i18n="nav.studio">الاستوديو</button>
    <button class="tb-btn tb-gis" data-drawer="export" data-i18n="nav.export">تنزيل بيانات GIS</button>
    <button class="tb-btn" id="tb-measure" data-i18n="v5.measure">قياس</button>
    <button class="tb-btn" data-drawer="status" data-i18n="v5.statusNav">الحالة</button>
  </nav>
  <div class="lang" id="lang" role="group" data-i18n-aria="lang.label"></div>
  <button class="btn btn-small tb-menu" id="tb-menu" aria-expanded="false" aria-controls="tb-nav" data-i18n="v5.menu">القائمة</button>
</header>

<main class="stage">
  <!-- LEFT: analysis and results (fixed in every language) -->
  <aside id="col-left" class="col col-left" data-i18n-aria="ui.analysisPanel">
    <div class="col-h">
      <div class="col-h-row">
        <div><span class="plate" data-i18n="ui.analysisPlate">ANALYSIS</span><h2 id="rep-title"></h2><div id="rep-meta" class="meta"></div></div>
        <div class="tools"><button class="btn btn-small btn-primary" id="btn-fabric" data-i18n="v5.viewAnalysis" hidden>عرض التحليل</button><button class="btn btn-small" id="btn-refresh" data-i18n="rep.refresh" hidden>تحديث</button><button class="icon-btn" id="btn-close-report" data-i18n-title="close" hidden>✕</button></div>
      </div>
      <div class="tabs" id="left-tabs" role="tablist"></div>
    </div>
    <div id="left-body" class="col-b"></div>
    <div class="resizer" data-resize="left" data-i18n-title="ui.resize"></div>
  </aside>
  <button class="col-toggle" id="tog-left" data-i18n-title="ui.toggleLeft">◀</button>

  <div id="map" data-i18n-aria="map.aria"></div>
  <div class="north" data-i18n-aria="north"><svg viewBox="0 0 24 40" width="16" height="27" aria-hidden="true"><path d="M12 2 L20 30 L12 24 L4 30 Z" fill="currentColor"/><text x="12" y="39" text-anchor="middle" font-size="9" font-family="IBM Plex Mono, monospace" fill="currentColor">N</text></svg></div>
  <div id="measure-out" class="measure-out" hidden></div>
  <div id="mode-banner" class="mode-banner" hidden></div>
  <div id="legend" class="legend" hidden></div>

  <!-- RIGHT: study area controls, then layers -->
  <button class="col-toggle" id="tog-right" data-i18n-title="ui.toggleRight">▶</button>
  <aside id="col-right" class="col col-right" data-i18n-aria="ui.studyPanel">
    <div class="resizer" data-resize="right" data-i18n-title="ui.resize"></div>
    <section id="panel-select" class="block">
      <header data-collapse="select"><h2 data-i18n="sel.title">منطقة الدراسة</h2><span class="chev">▾</span></header>
      <div class="block-b"></div>
    </section>
    <section id="panel-layers" class="block">
      <header data-collapse="layers"><h2 data-i18n="nav.layers">الطبقات</h2><span class="chev">▾</span></header>
      <div class="block-b"></div>
    </section>
  </aside>

  <section id="drawer" class="drawer" hidden>
    <div class="drawer-h"><h3 id="drawer-title"></h3><button class="btn btn-small" id="btn-close-drawer" data-i18n-title="close">✕</button></div>
    <div id="drawer-body" class="drawer-b"></div>
  </section>
  <nav class="phone-bar" id="phone-bar" aria-label="views"><button data-pv="analysis" data-i18n="v5.pvAnalysis">التحليل</button><button data-pv="map" data-i18n="v5.pvMap">الخريطة</button><button data-pv="study" data-i18n="v5.pvStudy">منطقة الدراسة والطبقات</button></nav>
  <section id="workspace" class="workspace" hidden></section>
  <section id="page" class="page" hidden></section>
</main>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
