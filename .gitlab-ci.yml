# GitLab Pages: publish the static site as-is (no build step). Tests and tools are not published.
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p /tmp/site && cp -r . /tmp/site/ && rm -rf /tmp/site/.git /tmp/site/tests /tmp/site/tools /tmp/site/.github
    - mv /tmp/site public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $VERIFY != "1"

# Live check of the published site (run on demand: new pipeline with VERIFY=1). Screenshots go to the job log as base64.
verify:
  stage: test
  image: mcr.microsoft.com/playwright/python:v1.48.0-jammy
  variables:
    SITE: "https://granada-atlas-597777.gitlab.io/"
  script:
    - pip install -q playwright==1.48.0 pillow
    - python tools/verify/live_atlas.py
  rules:
    - if: $VERIFY == "1"
